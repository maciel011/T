<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fff7f0;
      font-family: 'Segoe UI', sans-serif;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      background-image: url(https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOTMwNzNrbHZjZjRmdnh6bWtuN3hjYzdnZG41MWhrczl0cDJ5bmRpYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xS8IA2u84AglVevJii/giphy.gif);
    }
    .photo {
      max-width: 170px;
      border-radius: 15px;
      box-shadow: 0 6px 12px #ff00b7;
      margin-bottom: 20px;
    }
    .message {
      font-size: 1.5rem;
      color: white;
      margin-bottom: 20px;
      max-width: 1000px;
      font-weight: bold;
    }
    a {
      font-size: 1.5rem;
      color: hsl(324, 100%, 50%);
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 20px;
      display: inline-block;
    }
    a:hover {
      text-decoration: underline;
    }
    iframe {
      width: 300px;
      height: 150px;
      border-radius: 10px;
      box-shadow: 0 4px 8px #ff00b7;
    }
  </style>
</head>
<body>
  <!--
    1. Substitua YOUR_IMAGE_URL pela URL da foto dela.
    2. Substitua YOUR_MESSAGE pelo texto que você quer escrever.
    3. Substitua VIDEO_ID pelo ID do vídeo do YouTube (parte após 'v=' na URL).
  -->
  <img src="IMG_9920.png" alt="Foto Especial" class="photo">

  <div class="message">
  
A gente ainda tá se conhecendo, mas o destino já me contou um segredo: eu vou casar com você. 💍😅
  </div>

</html>
